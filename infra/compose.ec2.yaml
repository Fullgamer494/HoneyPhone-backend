name: honeyphone

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: honeyphone
      POSTGRES_USER: honeyphone
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyphone -d honeyphone"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  api:
    image: ${HONEYPHONE_API_IMAGE:-honeyphone-api:0.5.0}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://honeyphone:${DB_PASSWORD}@db:5432/honeyphone
      MAX_BODY_BYTES: 65536
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@myuspot.org}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://honeyphone-api.myuspot.org}
      APK_DOWNLOAD_URL: ${APK_DOWNLOAD_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [private, edge]

volumes:
  postgres_data:

networks:
  private:
    internal: true
  edge:
