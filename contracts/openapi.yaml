openapi: 3.1.0
info:
  title: HoneyPhone API
  description: API de HoneyPhone con cuentas, autenticación y datos aislados por usuario.
  version: 0.5.0
servers:
- url: http://127.0.0.1:8000
  description: Ubuntu local
- url: http://127.0.0.1:8081
  description: Android por adb reverse
- url: https://honeyphone-api.myuspot.org
  description: Producción
security:
- BearerAuth: []
paths:
  /healthz:
    get:
      summary: Health
      operationId: health_healthz_get
      security: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/register:
    post:
      tags:
      - accounts
      summary: Register
      operationId: register_api_v1_auth_register_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '201':
          description: Cuenta creada; se envía enlace de verificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailActionMessage'
        '409':
          description: El correo ya está registrado
        '503':
          description: Cuenta creada, pero SES no pudo enviar el correo
        '422':
          description: Datos inválidos
  /api/v1/auth/login:
    post:
      tags:
      - accounts
      summary: Login
      operationId: login_api_v1_auth_login_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: Credenciales incorrectas
        '403':
          description: Cuenta desactivada o correo sin verificar
        '422':
          description: Datos inválidos
  /api/v1/auth/verify-email/request:
    post:
      tags: [accounts]
      summary: Reenviar verificación de correo
      operationId: request_email_verification_api_v1_auth_verify_email_request_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailActionMessage'
        '503':
          description: Amazon SES no está disponible
  /api/v1/auth/verify-email/confirm:
    post:
      tags: [accounts]
      summary: Confirmar correo con enlace de un solo uso
      operationId: confirm_email_api_v1_auth_verify_email_confirm_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionToken'
      responses:
        '200':
          description: Correo confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailActionMessage'
        '400':
          description: Enlace vencido, consumido o inválido
  /api/v1/auth/password/forgot:
    post:
      tags: [accounts]
      summary: Solicitar recuperación de contraseña
      operationId: forgot_password_api_v1_auth_password_forgot_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailActionMessage'
        '503':
          description: Amazon SES no está disponible
  /api/v1/auth/password/reset:
    post:
      tags: [accounts]
      summary: Restablecer contraseña con enlace de un solo uso
      operationId: reset_password_api_v1_auth_password_reset_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailActionMessage'
        '400':
          description: Enlace vencido, consumido o inválido
  /api/v1/auth/google:
    post:
      tags:
      - accounts
      summary: Google Login
      operationId: google_login_api_v1_auth_google_post
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_token]
              properties:
                id_token:
                  type: string
                  minLength: 20
                  maxLength: 8192
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          description: Token de Google inválido
        '503':
          description: Acceso con Google no configurado o no disponible
  /api/v1/auth/me:
    get:
      tags:
      - accounts
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Cuenta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Sesión inválida o vencida
    delete:
      tags:
      - accounts
      summary: Delete Me
      operationId: delete_me_api_v1_auth_me_delete
      responses:
        '204':
          description: Cuenta y datos asociados eliminados
        '401':
          description: Sesión inválida o vencida
  /api/v1/network-checks:
    post:
      tags:
      - P0 checks
      summary: Create Check
      operationId: create_check_api_v1_network_checks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
          description: OK
        '409':
          description: ID con contenido distinto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Carga mayor que 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - P0 checks
      summary: List Checks
      operationId: list_checks_api_v1_network_checks_get
      parameters:
      - name: installation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Installation Id
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DataSource'
          - type: 'null'
          title: Source
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPage'
        '422':
          description: Cursor o filtros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/network-checks/{check_id}:
    get:
      tags:
      - P0 checks
      summary: Get Check
      operationId: get_check_api_v1_network_checks__check_id__get
      parameters:
      - name: check_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Check Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - P0 checks
      summary: Delete Check
      operationId: delete_check_api_v1_network_checks__check_id__delete
      parameters:
      - name: check_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Check Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/devices:
    post:
      tags:
      - devices
      summary: Register Device
      operationId: register_device_api_v1_devices_post
      parameters:
      - name: installation_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      - name: app_version
        in: query
        required: false
        schema:
          type: string
          default: 0.0.0
          title: App Version
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - devices
      summary: List Devices
      operationId: list_devices_api_v1_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/devices/{installation_id}:
    get:
      tags:
      - devices
      summary: Get Device
      operationId: get_device_api_v1_devices__installation_id__get
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - devices
      summary: Update Device
      operationId: update_device_api_v1_devices__installation_id__patch
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - devices
      summary: Revoke Device
      operationId: revoke_device_api_v1_devices__installation_id__delete
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/honeypot/sessions:
    post:
      tags:
      - honeypot
      summary: Upsert Session
      operationId: upsert_session_api_v1_honeypot_sessions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - honeypot
      summary: List Sessions
      operationId: list_sessions_api_v1_honeypot_sessions_get
      parameters:
      - name: installation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Installation Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/honeypot/sessions/{session_id}/events:
    post:
      tags:
      - honeypot
      summary: Append Events
      operationId: append_events_api_v1_honeypot_sessions__session_id__events_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - honeypot
      summary: List Events
      operationId: list_events_api_v1_honeypot_sessions__session_id__events_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/honeypot/sessions/{session_id}:
    parameters:
    - name: session_id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    delete:
      operationId: deleteHoneypotSession
      tags:
      - P1 honeypot
      x-phase: P1
      responses:
        '204':
          description: Sesión y eventos borrados
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      required: [user_id, email, email_verified]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: [string, 'null']
        email_verified:
          type: boolean
    EmailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ActionToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
    PasswordReset:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        password:
          type: string
          minLength: 10
          maxLength: 128
    EmailActionMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    AuthToken:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/Account'
    Source:
      type: string
      enum:
      - LIVE
      - DEMO
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 256
        request_id:
          type: string
          minLength: 1
          maxLength: 64
    HoneypotSession:
      type: object
      additionalProperties: false
      required:
      - session_id
      - installation_id
      - source
      - listen_port
      - started_at
      - ended_at
      - state
      properties:
        session_id: *id001
        installation_id: *id001
        source:
          $ref: '#/components/schemas/Source'
        listen_port:
          type: integer
          minimum: 1024
          maximum: 65535
          default: 8080
        started_at: &id002
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          enum:
          - RUNNING
          - STOPPED
          - INTERRUPTED
    HoneypotEvent:
      type: object
      additionalProperties: false
      required:
      - event_id
      - occurred_at
      - source_ip_masked
      - http_method
      - request_path
      - user_agent_family
      - content_length
      - response_code
      properties:
        event_id: *id001
        occurred_at: *id002
        source_ip_masked:
          type: string
          maxLength: 64
          description: 'CIDR normalizado: /24 IPv4 o /64 IPv6; validar formato y bits
            de host.'
        http_method:
          type: string
          enum:
          - GET
          - HEAD
          - POST
          - OTHER
        request_path:
          type: string
          enum:
          - /
          - /admin
          - /login
          - /robots.txt
          - /other
        user_agent_family:
          type:
          - string
          - 'null'
          enum:
          - BROWSER
          - SCANNER
          - OTHER
          - UNKNOWN
          - null
        content_length:
          type: integer
          minimum: 0
          maximum: 2147483647
        response_code:
          type: integer
          minimum: 100
          maximum: 599
    EventBatch:
      properties:
        events:
          items:
            $ref: '#/components/schemas/EventInput'
          type: array
          maxItems: 100
          minItems: 1
          title: Events
      additionalProperties: false
      type: object
      required:
      - events
      title: EventBatch
    BatchResult:
      type: object
      additionalProperties: false
      required:
      - inserted_count
      - duplicate_count
      properties:
        inserted_count:
          type: integer
          minimum: 0
        duplicate_count:
          type: integer
          minimum: 0
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoneypotSession'
        next_cursor:
          type:
          - string
          - 'null'
    EventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoneypotEvent'
        next_cursor:
          type:
          - string
          - 'null'
    CheckCreate:
      properties:
        check_id:
          type: string
          format: uuid
          title: Check Id
        installation_id:
          type: string
          format: uuid
          title: Installation Id
        source:
          $ref: '#/components/schemas/DataSource'
        network_label:
          anyOf:
          - type: string
            maxLength: 40
            minLength: 1
          - type: 'null'
          title: Network Label
        wifi_metrics:
          anyOf:
          - $ref: '#/components/schemas/WifiMetrics'
          - type: 'null'
        app_version:
          type: string
          maxLength: 32
          minLength: 1
          title: App Version
        android_api_level:
          type: integer
          maximum: 100.0
          minimum: 29.0
          title: Android Api Level
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          type: string
          format: date-time
          title: Finished At
        run_status:
          $ref: '#/components/schemas/RunStatus'
        signals:
          items:
            $ref: '#/components/schemas/CheckSignalCreate'
          type: array
          maxItems: 4
          minItems: 4
          title: Signals
      additionalProperties: false
      type: object
      required:
      - check_id
      - installation_id
      - source
      - app_version
      - android_api_level
      - started_at
      - finished_at
      - run_status
      - signals
      title: CheckCreate
    CheckPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CheckResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: false
      type: object
      required:
      - items
      - next_cursor
      title: CheckPage
    CheckResponse:
      properties:
        network_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Network Label
        wifi_metrics:
          anyOf:
          - $ref: '#/components/schemas/WifiMetrics'
          - type: 'null'
        check_id:
          type: string
          format: uuid
          title: Check Id
        installation_id:
          type: string
          format: uuid
          title: Installation Id
        source:
          $ref: '#/components/schemas/DataSource'
        app_version:
          type: string
          title: App Version
        android_api_level:
          type: integer
          title: Android Api Level
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          type: string
          format: date-time
          title: Finished At
        run_status:
          $ref: '#/components/schemas/RunStatus'
        signals:
          items:
            $ref: '#/components/schemas/CheckSignalResponse'
          type: array
          title: Signals
        verdict:
          $ref: '#/components/schemas/OverallVerdict'
        has_attention:
          type: boolean
          title: Has Attention
        received_at:
          type: string
          format: date-time
          title: Received At
      additionalProperties: false
      type: object
      required:
      - check_id
      - installation_id
      - source
      - app_version
      - android_api_level
