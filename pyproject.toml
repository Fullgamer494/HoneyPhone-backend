[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "honeyphone-api"
version = "0.5.0"
description = "API de HoneyPhone con cuentas y datos aislados por usuario"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "google-auth[requests]>=2.30,<3",
  "requests>=2.31,<3",
  "email-validator>=2.2,<3",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "PyYAML>=6,<7", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honeyphone = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
