<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090a0b">
  <title>Cuenta HoneyPhone</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 0,#222629,transparent 45%),#090a0b;color:#f3f4f4;font:16px/1.55 system-ui,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,480px);padding:32px;border:1px solid #303437;background:#111315;border-radius:22px}.brand{font-size:12px;letter-spacing:.2em;color:#aeb2b4;font-weight:700}.mark{display:inline-block;width:19px;height:19px;vertical-align:middle;margin-right:7px;border:1px solid #ddd;border-radius:6px;background:radial-gradient(circle,transparent 30%,#ddd 32% 36%,transparent 38% 48%,#aaa 50% 53%,transparent 55%)}h1{font-size:27px;line-height:1.1;letter-spacing:-.04em;margin:26px 0 10px}p{color:#aeb2b4}label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}input{width:100%;height:48px;padding:0 14px;border:1px solid #45494b;border-radius:11px;background:#090a0b;color:#fff;font:inherit}button{width:100%;height:48px;margin-top:18px;border:0;border-radius:11px;background:#f3f4f4;color:#101112;font:700 14px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:16px;min-height:24px;color:#d1d4d5;font-size:14px}.status.error{color:#ffb5b5}.back{display:inline-block;margin-top:22px;font-size:14px;color:#c6c9ca}
  </style>
</head>
<body><main class="card"><div class="brand"><span class="mark"></span>HONEYPHONE</div><h1 id="title">Gestiona tu cuenta</h1><p id="description">Sigue las instrucciones para continuar.</p><form id="form" hidden><div id="passwords" hidden><label for="password">Nueva contraseña</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><label for="confirm">Confirma la contraseña</label><input id="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><button id="submit" type="submit">Continuar</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="back" href="/">Volver a HoneyPhone ↗</a></main>
<script>
(()=>{const path=location.pathname;const reset=path.includes('/reset');const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);const title=document.getElementById('title'),description=document.getElementById('description'),form=document.getElementById('form'),status=document.getElementById('status'),button=document.getElementById('submit'),passwords=document.getElementById('passwords');title.textContent=reset?'Restablece tu contraseña':'Confirma tu correo';description.textContent=reset?'Elige una contraseña nueva para recuperar el acceso a tu cuenta.':'Confirma la dirección de correo asociada a tu cuenta HoneyPhone.';if(!token){status.textContent=reset?'Falta el enlace de recuperación. Solicita uno nuevo desde la app.':'Falta el enlace de confirmación. Pide que te lo reenviemos desde la app.';status.classList.add('error');return}form.hidden=false;passwords.hidden=!reset;button.textContent=reset?'Guardar contraseña':'Confirmar correo';form.addEventListener('submit',async event=>{event.preventDefault();if(reset&&document.getElementById('password').value!==document.getElementById('confirm').value){status.textContent='Las contraseñas no coinciden.';status.classList.add('error');return}button.disabled=true;status.classList.remove('error');status.textContent='Procesando…';try{const body=reset?{token,password:document.getElementById('password').value}:{token};const response=await fetch(reset?'/api/v1/auth/password/reset':'/api/v1/auth/verify-email/confirm',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(result.message||'No fue posible completar la operación.');status.textContent=result.message||'Listo.';title.textContent=reset?'Contraseña actualizada':'Correo confirmado';description.textContent=reset?'Ya puedes volver a HoneyPhone e iniciar sesión.':'Ya puedes volver a HoneyPhone e iniciar sesión.';form.hidden=true}catch(error){status.textContent=error.message||'No fue posible completar la operación.';status.classList.add('error');button.disabled=false}})})();
</script></body></html>
